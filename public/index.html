<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BACKOFFICE CAMPOANDINO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../sistemas/horas_paradas/acceso.css">
</head>
<body>

  <div id="app" class="login-container">
  <center>
    <img src="../shared/images/logo.png" alt="Logo" height="180" width="180" style="margin-bottom: 18px;">
  </center>
  <form @submit.prevent="submit" onsubmit="event.preventDefault()">
    <label class="login-label" for="txtUsu">Usuario</label>
    <input class="login-input" id="txtUsu" name="usuario" type="text" autocomplete="off" required v-model="usuario">
    <label class="login-label" for="txtPass">Contraseña</label>
    <input class="login-input" id="txtPass" name="password" type="password" autocomplete="off" required v-model="password">
    <button class="login-button" type="submit" onclick="try{btnAcceder_Click();}catch(e){}">Acceder</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn3.devexpress.com/jslib/22.2.6/js/jquery.min.js"></script>
<script src="https://cdn3.devexpress.com/jslib/22.2.6/js/dx.all.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@2.6.12/dist/vue.js"></script>
<script src="../sistemas/horas_paradas/acceso.js"></script>
</body>
</html>
